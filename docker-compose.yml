services:
  bbom-auth-forgot-password-module-localhost:
    build: 
      context: ./
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    command: npm run localhost
    volumes:
      - .:/app
      - /app/node_modules
    develop:
      watch:
      - action: sync
        path: ./src
        target: /app/src
      - action: rebuild
        path: package.json

  bbom-auth-forgot-password-tests:
    build:
      context: ./
      dockerfile: Dockerfile
    command: npm run test:isolated
    volumes:
      - .:/app
      - /app/node_modules
    profiles:
      - test
